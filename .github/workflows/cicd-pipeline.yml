name: CICD Pipeline

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 16

    - name: Build
      run: |
        echo "Installing dependencies..."
        npm install
        
    - name: Test
      run: |
        echo "Running tests..."
        npm test -- --browsers=ChromeHeadless --watch=false
