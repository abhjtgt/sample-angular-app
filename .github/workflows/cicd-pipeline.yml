name: CICD Pipeline

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 16

    - name: Install Firefox
      run: |
        sudo apt-get update
        sudo apt-get install -y firefox
        
    - name: Build
      run: |
        echo "Installing dependencies..."
        npm install
        
    - name: Test
      run: |
        echo "Running tests..."
        npm test -- --browsers=Firefox --watch=false
